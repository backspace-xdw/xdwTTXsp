################################################################################
# xdwTTXsp GPS监控平台 - nginx 配置 (Windows)
#
# 使用方法:
# 1. 下载 nginx for Windows: http://nginx.org/en/download.html
# 2. 将此文件内容覆盖到 nginx\conf\nginx.conf
# 3. 修改 frontend_dist_path 为实际的前端 dist 目录路径
# 4. 启动: nginx.exe
# 5. 停止: nginx.exe -s stop
# 6. 重载配置: nginx.exe -s reload
################################################################################

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # 开启 gzip 压缩
    gzip  on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    server {
        # 监听端口，可改为 80 或其他端口
        listen       8090;
        server_name  localhost;

        # ================================================
        # 前端静态文件
        # 修改 root 路径为实际 dist 目录的绝对路径
        # Windows 路径示例: C:/xdwTTXsp/frontend/dist
        # ================================================
        root   C:/xdwTTXsp/frontend/dist;
        index  index.html;

        # API 请求代理到后端
        location /api/ {
            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
        }

        # WebSocket (Socket.IO) 代理
        location /socket.io/ {
            proxy_pass http://127.0.0.1:8081;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
        }

        # 前端 SPA 路由支持 (所有路径回退到 index.html)
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 错误页面
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
